name: Restore POS catalog
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: dry_run
        type: choice
        options: [dry_run, restore]
      confirmation:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pos-catalog-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_CONNECTION: mysql
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      MYSQL_ATTR_SSL_CA: /etc/ssl/certs/ca-certificates.crt
      MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_mysql, tools: composer:v2 }
      - working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
      - if: inputs.mode == 'dry_run'
        working-directory: backend
        run: php artisan pos:restore-catalog --dry-run --no-interaction
      - if: inputs.mode == 'restore' && inputs.confirmation == 'RESTORE_POS_CATALOG'
        working-directory: backend
        run: php artisan pos:restore-catalog --force --no-interaction
      - if: inputs.mode == 'restore' && inputs.confirmation != 'RESTORE_POS_CATALOG'
        run: exit 1
