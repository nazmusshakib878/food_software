services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in deploy/oci/.env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in deploy/oci/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/oci/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/oci/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/oci/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_SECURE_COOKIE: "true"
      APP_TIMEZONE: Asia/Dhaka
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    command:
      - /bin/sh
      - -c
      - >-
        if [ -s /etc/letsencrypt/live/nur-food-pos/fullchain.pem ]; then
          cp /etc/nginx/custom/nginx.conf /etc/nginx/conf.d/default.conf;
        else
          cp /etc/nginx/custom/bootstrap.conf /etc/nginx/conf.d/default.conf;
        fi;
        exec nginx -g 'daemon off;'
    volumes:
      - ./deploy/oci/nginx:/etc/nginx/custom:ro
      - ./backend/public:/var/www/html/public:ro
      - ./deploy/oci/certbot/www:/var/www/certbot:ro
      - ./deploy/oci/letsencrypt:/etc/letsencrypt:ro
    networks:
      - private
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: ["certbot"]
    volumes:
      - ./deploy/oci/letsencrypt:/etc/letsencrypt
      - ./deploy/oci/certbot/www:/var/www/certbot

networks:
  private:
    driver: bridge

volumes:
  mysql_data:
    name: nurfood_mysql_data
  laravel_storage:
    name: nurfood_laravel_storage
