<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Shift</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #f0f0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .card-container {
            width: 90%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
        }

        .title {
            text-align: center;
            color: #3b3552; /* dark navy/purple tone */
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 15px;
            font-weight: 500;
            color: #7a7a8c;
            margin-bottom: 8px;
        }

        .form-input, .form-textarea {
            width: 100%;
            background-color: #efeff1;
            border: 1px solid #e2e2e8;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: #4a4a4a;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: #14918e;
            background-color: #ffffff;
        }

        .form-input::placeholder, .form-textarea::placeholder {
            color: #a0a0b0;
            font-weight: 400;
        }

        /* RTL specific for Arabic inputs */
        .input-rtl {
            font-family: 'Noto Sans Arabic', sans-serif;
            text-align: right;
            font-weight: 600;
            color: #222222;
        }

        .form-textarea {
            resize: none;
            height: 110px;
        }

        .btn-save {
            width: 100%;
            background-color: #14918e; /* deep teal */
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            border: none;
            border-radius: 12px;
            margin-top: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-save:hover {
            background-color: #0f7a77;
        }

        .btn-save:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1 class="title">New Shift</h1>
        
        <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" class="form-input input-rtl" value="محمد نور">
        </div>

        <div class="form-group">
            <label class="form-label">English Name</label>
            <input type="text" class="form-input input-rtl" value="محمد نور">
        </div>

        <div class="form-group">
            <label class="form-label">Money Amount</label>
            <input type="number" class="form-input" placeholder="Enter amount">
        </div>

        <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea class="form-textarea" placeholder="Add any notes here..."></textarea>
        </div>

        <button type="button" class="btn-save" onclick="window.location.href='index.html'">Save</button>
    </div>

</body>
</html>
