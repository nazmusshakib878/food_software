<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Shift</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            min-height: 100%;
            background-color: #f0f0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 24px;
        }

        .card-container {
            width: min(90vw, 686px);
            background-color: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: clamp(32px, 6vw, 64px) clamp(24px, 6vw, 48px);
            display: flex;
            flex-direction: column;
        }

        .title {
            text-align: center;
            color: #1a2536;
            font-size: clamp(28px, 5vw, 46px);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: clamp(32px, 5vw, 52px);
        }

        .form-group {
            margin-bottom: clamp(20px, 3.5vw, 32px);
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: clamp(17px, 3vw, 26px);
            font-weight: 500;
            color: #7a7a8c;
            margin-bottom: 10px;
        }

        .form-input, .form-textarea {
            width: 100%;
            background-color: #efeff1;
            border: 1px solid #e2e2e8;
            border-radius: 18px;
            padding: 17px 20px;
            min-height: 58px;
            font-size: clamp(17px, 2.8vw, 23px);
            color: #4a4a4a;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: #14918e;
            background-color: #ffffff;
        }

        .form-input::placeholder, .form-textarea::placeholder {
            color: #a0a0b0;
            font-weight: 400;
        }

        /* RTL specific for Arabic inputs */
        .input-rtl {
            font-family: 'Noto Sans Arabic', sans-serif;
            text-align: right;
            font-weight: 600;
            color: #4a4a4a;
        }

        .form-textarea {
            resize: none;
            min-height: 156px;
            line-height: 1.45;
        }

        .btn-save {
            width: 100%;
            background-color: #14918e;
            color: #ffffff;
            font-size: clamp(18px, 3vw, 26px);
            font-weight: 600;
            padding: 18px;
            border: none;
            border-radius: 18px;
            margin-top: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-save:hover {
            background-color: #0f7a77;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .form-error {
            min-height: 20px;
            margin: -12px 0 12px;
            color: #b42318;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            body, html {
                padding: 12px;
            }

            .card-container {
                width: 100%;
                border-radius: 28px;
            }
        }
    </style>
</head>
<body>

    <form class="card-container" id="newShiftForm" novalidate>
        <h1 class="title">New Shift</h1>
        
        <div class="form-group">
            <label class="form-label" for="shiftName">Name</label>
            <input id="shiftName" name="name" type="text" class="form-input input-rtl" value="محمد نور">
        </div>

        <div class="form-group">
            <label class="form-label" for="shiftEnglishName">English Name</label>
            <input id="shiftEnglishName" name="englishName" type="text" class="form-input input-rtl" value="محمد نور">
        </div>

        <div class="form-group">
            <label class="form-label" for="openingCash">Money Amount</label>
            <input id="openingCash" name="openingCash" type="number" class="form-input" placeholder="Enter amount" min="0.01" step="0.01" inputmode="decimal" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="shiftNotes">Notes</label>
            <textarea id="shiftNotes" name="notes" class="form-textarea" placeholder="Add any notes here..."></textarea>
        </div>

        <p class="form-error" id="formError" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn-save">Save</button>
    </form>

    <script>
        document.getElementById('newShiftForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const openingCashInput = document.getElementById('openingCash');
            const openingCash = Number(openingCashInput.value);
            const formError = document.getElementById('formError');

            if (!Number.isFinite(openingCash) || openingCash <= 0) {
                formError.textContent = 'Enter the starting cash amount to continue.';
                openingCashInput.focus();
                return;
            }

            localStorage.setItem('nurpos_current_shift', JSON.stringify({
                name: document.getElementById('shiftName').value.trim(),
                englishName: document.getElementById('shiftEnglishName').value.trim(),
                openingCash,
                notes: document.getElementById('shiftNotes').value.trim(),
                startedAt: new Date().toISOString()
            }));

            window.location.href = 'index.html?shift=started';
        });
    </script>

</body>
</html>
